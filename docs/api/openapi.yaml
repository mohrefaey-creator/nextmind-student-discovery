      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareRequest' } } }
      responses:
        '201': { description: Shared, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/shares/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      operationId: revokeShare
      tags: [Reports]
      summary: Revoke a share
      x-authorization: report.share (student)
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }


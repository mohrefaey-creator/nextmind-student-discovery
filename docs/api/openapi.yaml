openapi: 3.1.0
info:
  title: NextMind Student Discovery, Aptitude & University Major Fit — prototype API
  version: 0.2.0
  summary: Synthetic-data prototype contract. Not a production interface.
  description: |
    Machine-readable contract of the local prototype. `docs/06_API.md` is the human summary; this file is checked
    against the running server by `npm run test:contract` (every registered route is described here, every response
    the test scenario produces is validated against these schemas, and every outbox event is validated against
    `events.schema.json`).

    **Safety invariants that are part of the contract, not prose**
    - `norm_reference` is always `null` (no norms, no percentiles).
    - `admission_status.acceptance_probability` is always `null`; the API never returns an admission probability.
    - `composite_fit.value` is `null` and `approved_model` is `false` until an approved weighting model exists.
    - Errors are RFC 7807 problems. Identity-related denials all read `reason: not_available`, so a caller cannot
      tell "no such record" from "someone else's record".

    **Conventions.** Sessions use the `sd_session` cookie. Every non-GET request (except login and logout) must also
    send the `X-CSRF-Token` returned by login / `me`. Non-GET requests may send `Idempotency-Key`; a replay is
    answered from the first result while nothing that could change authorization (consent, links, assignments) has
    changed. Every response carries `X-Request-Id`.
  license:
    name: Synthetic prototype, no licence granted
    identifier: LicenseRef-Prototype
servers:
  - url: http://127.0.0.1:4180
    description: Local prototype (loopback only)
tags:
  - { name: Platform, description: Health and the identity stand-in (not real authentication) }
  - { name: Assessments }
  - { name: Student data }
  - { name: Recommendations }
  - { name: Cases }
  - { name: Reports }
  - { name: Advisor }
  - { name: Governance }
security: []

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [Platform]
      summary: Liveness and mode
      x-authorization: public
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-stub/personas:
    get:
      operationId: listPersonas
      tags: [Platform]
      summary: Synthetic personas to sign in as
      x-authorization: public
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PersonaList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-stub/login:
    post:
      operationId: login
      tags: [Platform]
      summary: Sign in as a persona (stand-in for the identity service)
      x-authorization: public (rate limited per client address)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: Signed in; sets the `sd_session` cookie
          headers: { Set-Cookie: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-stub/logout:
    post:
      operationId: logout
      tags: [Platform]
      summary: End the session
      x-authorization: public
      security: []
      responses:
        '200': { description: Signed out, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-stub/me:
    get:
      operationId: getMe
      tags: [Platform]
      summary: Who am I, linked students, incident state, policy placeholders
      x-authorization: public (anonymous callers get authenticated=false)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ assessments
  /api/v1/discovery/assessments:
    get:
      operationId: listMyAssessments
      tags: [Assessments]
      summary: Modules for the signed-in student
      x-authorization: student (self)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/assessments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: listAssessmentsForStudent
      tags: [Assessments]
      summary: Modules for a student, by id
      x-authorization: session.read (student only)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions:
    post:
      operationId: createSession
      tags: [Assessments]
      summary: Start or resume an attempt
      x-authorization: session.create (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSessionRequest' } } }
      responses:
        '201': { description: New attempt, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreated' } } } }
        '200': { description: Existing attempt returned, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreated' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getSession
      tags: [Assessments]
      summary: Items (localized, no keys), scales and saved answers
      x-authorization: session.read (student)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions/{id}/responses/{itemId}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/ItemId' }]
    put:
      operationId: saveResponse
      tags: [Assessments]
      summary: Save one typed answer (server-validated, revisioned)
      x-authorization: session.write (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { name: If-Match, in: header, required: false, schema: { type: string }, description: Expected revision, as returned in ETag }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveResponseRequest' } } }
      responses:
        '200':
          description: Saved
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedResponse' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: submitSession
      tags: [Assessments]
      summary: Seal and score (deterministic). Duplicate or concurrent submits give one result
      x-authorization: session.write (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitRequest' } } }
      responses:
        '201': { description: Sealed now, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitResult' } } } }
        '200': { description: Already sealed, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions/{id}/score:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getScore
      tags: [Assessments]
      summary: Sealed score with provenance
      x-authorization: score.read (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScoreView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions/{id}/responses:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getRawResponses
      tags: [Assessments]
      summary: Individual answers (a separate visibility class; a guardian never)
      x-authorization: responses.read_raw (student; counselor + counselor_sharing + raw_answer_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RawResponses' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/sessions/{id}/replay:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: replayScore
      tags: [Assessments]
      summary: Recompute from the sealed answers and compare hashes
      x-authorization: score.replay (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ student data
  /api/v1/discovery/students/{id}/discovery-profile:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getDiscoveryProfile
      tags: [Student data]
      summary: Panels, completeness, evidence, aspirations, preferences, journey
      x-authorization: profile.read (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryProfile' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/consent:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getConsent
      tags: [Student data]
      summary: Derived consent state per scope and party
      x-authorization: consent.read (student; guardian of a minor; counselor)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentState' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: setConsent
      tags: [Student data]
      summary: Grant or withdraw one scope (withdrawing still works during an incident; granting returns 503)
      x-authorization: consent.write (student; guardian only for assessment_processing and only while the student is a minor)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetConsentRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SetConsentResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/evidence:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: listEvidence
      tags: [Student data]
      summary: Latest and history of academic evidence
      x-authorization: evidence.read (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceList' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/evidence/{type}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { name: type, in: path, required: true, schema: { type: string }, description: 'pathway, secondary_percentage, gat, saat or subject_grade:<subject>' }]
    put:
      operationId: putEvidence
      tags: [Student data]
      summary: Enter a value (always unverified)
      x-authorization: evidence.write (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutEvidenceRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceChange' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/evidence/{evidenceId}/verify:
    parameters: [{ $ref: '#/components/parameters/Id' }, { name: evidenceId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: verifyEvidence
      tags: [Student data]
      summary: Mark counselor-verified (a note is required)
      x-authorization: evidence.verify (counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyEvidenceRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceChange' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/preferences:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      operationId: putPreferences
      tags: [Student data]
      summary: Accessibility and language preferences
      x-authorization: preferences.write (student)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreferencesRequest' } } }
      responses:
        '200': { description: The values that were stored, content: { application/json: { schema: { $ref: '#/components/schemas/PreferencesRequest' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/aspirations/{programId}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/ProgramId' }]
    put:
      operationId: pinAspiration
      tags: [Student data]
      summary: Pin a major (at most 5)
      x-authorization: aspiration.write (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/AspirationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Aspiration' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: unpinAspiration
      tags: [Student data]
      summary: Unpin a major
      x-authorization: aspiration.write (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Removed' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/guardian-summary:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getGuardianSummary
      tags: [Student data]
      summary: Allow-listed summary for a linked guardian
      x-authorization: guardian.summary (guardian + guardian_summary_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GuardianSummary' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ recommendations & catalog
  /api/v1/discovery/students/{id}/recommendations:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: createRecommendation
      tags: [Recommendations]
      summary: Deterministic run; identical inputs return the same run
      x-authorization: recommendation.create (student + assessment_processing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '201': { description: New run, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRunCreated' } } } }
        '200': { description: Same inputs, existing run, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRunCreated' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRecommendations
      tags: [Recommendations]
      summary: Run history
      x-authorization: recommendation.read (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RecommendationRunSummary' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/recommendations/{runId}:
    parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getRecommendation
      tags: [Recommendations]
      summary: Stored output (immutable)
      x-authorization: recommendation.read (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRun' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/programs:
    get:
      operationId: listPrograms
      tags: [Recommendations]
      summary: Fictional program catalog
      x-authorization: any signed-in user
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: cluster, in: query, schema: { type: string } }
        - { name: university, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: source_state, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProgramList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/programs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getProgram
      tags: [Recommendations]
      summary: Program, profile, pathways
      x-authorization: any signed-in user
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProgramDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/programs/{id}/admissions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getProgramAdmissions
      tags: [Recommendations]
      summary: Active rule, provenance, freshness and version list (drafts only for stewards)
      x-authorization: any signed-in user
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycle, in: query, schema: { type: string, pattern: '^[0-9]{4}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProgramAdmissions' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ cases, notes, overrides, assignments
  /api/v1/discovery/students/{id}/cases:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: openCase
      tags: [Cases]
      summary: "Open a case (student: help, appeal, dispute; counselor: any reason)"
      x-authorization: case.open (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenCaseRequest' } } }
      responses:
        '201': { description: Opened, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listStudentCases
      tags: [Cases]
      summary: Cases for a student
      x-authorization: case.open (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Case' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/counselor-review:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: requestCounselorReview
      tags: [Cases]
      summary: Spec-named alias of openCase
      x-authorization: case.open (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenCaseRequest' } } }
      responses:
        '201': { description: Opened, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/cases/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: updateCase
      tags: [Cases]
      summary: Move a case to in_review or resolved (a resolution is required)
      x-authorization: case.review (counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCaseRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/notes:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: addNote
      tags: [Cases]
      summary: Counselor note (counselor_only or student visibility)
      x-authorization: case.review (counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoteRequest' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/overrides:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: createOverride
      tags: [Cases]
      summary: Signed interpretation note over a sealed score; never changes answers or scores
      x-authorization: override.create (counselor + counselor_sharing)
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OverrideRequest' } } }
      responses:
        '201': { description: Signed, content: { application/json: { schema: { $ref: '#/components/schemas/Override' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/counselor/queue:
    get:
      operationId: getCounselorQueue
      tags: [Cases]
      summary: Currently assigned students and reasons; no peeking without consent
      x-authorization: counselor
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CounselorQueue' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/case360:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getCase360
      tags: [Cases]
      summary: Review bundle (the read is audited with its purpose; raw answers are not included)
      x-authorization: case.review (counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [case_review, parent_inquiry, appeal_review, follow_up, safeguarding] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Case360' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/students/{id}/conflict-of-interest:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: declareConflictOfInterest
      tags: [Cases]
      summary: The assigned counselor steps away; access ends at once and cannot return for this student
      description: Needs no consent from the student, because stepping away only removes access. The stated reason is kept with the conflict record and is never copied into the audit log or any list.
      x-authorization: the currently assigned counselor only
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConflictRequest' } } }
      responses:
        '200': { description: Stepped away, content: { application/json: { schema: { $ref: '#/components/schemas/ConflictResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ reports
  /api/v1/discovery/students/{id}/reports:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: generateReport
      tags: [Reports]
      summary: Build a report (identical content returns the same report)
      x-authorization: report.generate (student only)
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '201': { description: New report, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreated' } } } }
        '200': { description: Identical report already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreated' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listReports
      tags: [Reports]
      summary: List reports
      x-authorization: report.read (student; counselor + counselor_sharing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReportListItem' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/reports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getReport
      tags: [Reports]
      summary: View a report (DRAFT watermark until approved)
      x-authorization: report.read (student; counselor + counselor_sharing); guardian only through an active share
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReportView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/reports/{id}/pdf:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: downloadReportPdf
      tags: [Reports]
      summary: Tagged PDF of an approved report (rendered by an installed Chromium or Chrome)
      description: Same authorization as reading the report. 409 until approved; 501 when no browser is installed; 502 when rendering fails; 429 when too many renders are queued. Nothing about the downloader is printed, so identical approved content and language give an identical (cached) file.
      x-authorization: as getReport, and the report must be approved
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: locale, in: query, schema: { type: string, enum: [ar-SA, en], default: ar-SA } }
      responses:
        '200':
          description: The PDF
          headers: { Content-Disposition: { schema: { type: string } } }
          content: { application/pdf: { schema: { type: string, contentMediaType: application/pdf, format: binary } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/reports/{id}/review-request:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: requestReportReview
      tags: [Reports]
      summary: Ask the counselor to review a draft
      x-authorization: report.generate (student only)
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReportRecord' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/reports/{id}/approval:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: decideReport
      tags: [Reports]
      summary: Approve or reject, bound to the exact payload hash
      x-authorization: report.approve (counselor + counselor_sharing); never the creator
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DecideReportRequest' } } }
      responses:
        '200': { description: Decided, content: { application/json: { schema: { $ref: '#/components/schemas/ReportDecision' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/discovery/reports/{id}/shares:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: shareReport
